<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="NOCO WATCH">
  <defs>
    <linearGradient id="nwGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="nwMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Mark -->
  <g transform="translate(18,28)" filter="url(#softGlow)">
    <rect x="0" y="0" width="104" height="104" rx="28" fill="#120914" stroke="url(#nwGlow)" stroke-width="3"/>
    <circle cx="52" cy="52" r="30" fill="none" stroke="url(#nwGlow)" stroke-width="3" opacity="0.9"/>
    <path d="M44 36 L74 52 L44 68 Z" fill="url(#nwMark)"/>
    <circle cx="52" cy="52" r="3" fill="#e11d48"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(150,52)" font-family="Arial Black, Arial, sans-serif">
    <text x="0" y="42" font-size="58" font-weight="900" letter-spacing="6" fill="#f8fafc">NOCO</text>
    <text x="210" y="42" font-size="58" font-weight="900" letter-spacing="4" fill="url(#nwGlow)">WATCH</text>
    <text x="2" y="78" font-size="14" letter-spacing="8" fill="#9aa3b8">ORIGINALS STREAMING</text>
  </g>
</svg>
